<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HN Sidecar</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header id="header">
      <h1>HN Sidecar</h1>
      <button id="refresh" type="button">Check again</button>
      <p id="status" class="notice" role="status">Checking this page…</p>
      <p id="checked" class="notice"></p>
      <p id="detail" class="notice" hidden></p>
    </header>
    <p class="guide">
      Open an article, then click the toolbar icon or press <kbd>Alt+H</kbd>. Matching stays on your device.
    </p>
    <main id="submissions" class="scroller"></main>
    <footer>
      <a href="https://github.com/vrennat/hn-sidecar" target="_blank" rel="noopener noreferrer">Source code</a>
      <a href="https://github.com/vrennat/hn-sidecar/issues" target="_blank" rel="noopener noreferrer">Help</a>

        >Privacy</a
      >
    </footer>
    <script type="module" src="panel.js"></script>
  </body>
</html>
